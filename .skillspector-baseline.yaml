# SkillSpector baseline for Omarchy Sentinel.
# Reviewed 2026-09-06 against a clean 'git archive HEAD' export with skillspector v2.9.6 --no-llm.
# Every suppression below was read and justified in docs/collab/reviews/SKILLSPECTOR-SELF-SCAN.md.
# Deliberate policy: src/ is suppressed per finding (fingerprints), never by glob, so any NEW
# finding in the daemon or CLI shows up on the next scan.
version: 2
scanner_version: 2.9.6
rules:
  - path: "docs/**"
    reason: "Documentation of the threat model. The scanner matches prose describing the attacks Sentinel detects -- 'curl | bash', 'credentials.json', 'systemctl --user enable' -- not executable content."
  - path: "*.md"
    reason: "Same as docs/**: README and AGENTS.md describe the behaviour being detected."
  - path: "tests/**"
    reason: "Test fixtures deliberately contain hostile argv, secret-shaped values and watched paths; several tests exist precisely to prove those values are redacted."
  - path: "scripts/collab/**"
    reason: "Developer orchestration for the two-agent workflow; not installed by the plugin. The curl is a connectivity preflight to xAI that sends no data (-o /dev/null)."
  - path: "scripts/install-*.sh"
    reason: "Installing a per-user systemd unit is the product's documented purpose, and the chmod 755/644 calls set mode bits on non-secret files. State files are written 0600 in 0700 dirs by sentinel.fsutil, which the scanner does not model."
  - path: "track-b/**"
    reason: "Track A/B health units for this T2 MacBook; same systemd-enable pattern, user scope only."
  - path: "LICENSE"
    reason: "The Apache-2.0 text is not code."
  - path: "pyproject.toml"
    reason: "Dependency metadata for a stdlib-only package; there is nothing to pin."
